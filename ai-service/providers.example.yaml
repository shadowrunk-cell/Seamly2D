# ============================================================
# SeamlyAI AI-Service: настройка провайдеров LLM
#
# КАК ИСПОЛЬЗОВАТЬ:
#   1. Скопируйте этот файл в providers.yaml
#   2. Заполните хотя бы одного провайдера (text ИЛИ vision)
#   3. Перезапустите сервис
#
# ПРИНЦИП: привязка НЕ железная. Модели можно менять в любой
# момент без изменения кода — просто правим этот файл.
#
# ТИПЫ РОЛЕЙ (набор очень гибкий):
#   text     - основная языковая модель (считает, генерирует формулы)
#   vision   - модель со зрением (смотрит фото/эскизы)
#   image    - (опц.) модель генерации картинок
#
# Одна и та же модель может закрывать несколько ролей
# (например, Claude - и text, и vision одновременно).
# ============================================================

# Какая роль используется по умолчанию, если не указано в запросе
default_text_role: text
default_vision_role: vision

providers:
  # ---------------------------------------------------------
  # OpenAI-совместимый (покрывает: OpenAI, Azure, Ollama,
  # LM Studio, vLLM, многие локальные серверы, GigaChat и т.д.)
  # ---------------------------------------------------------
  - name: openai-compat
    type: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o
    models:
      - role: text
        name: gpt-4o
      - role: vision
        name: gpt-4o

  # ---------------------------------------------------------
  # Anthropic Claude (текст + зрение в одной модели)
  # ---------------------------------------------------------
  - name: anthropic
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-sonnet-4-20250514
    models:
      - role: text
        name: claude-sonnet-4-20250514
      - role: vision
        name: claude-sonnet-4-20250514

  # ---------------------------------------------------------
  # Локальная модель через Ollama (работает офлайн)
  # Включите, раскомментировав блок ниже
  # ---------------------------------------------------------
  # - name: ollama
  #   type: openai_compat
  #   base_url: http://localhost:11434/v1
  #   api_key_env: ""        # Ollama ключ не требует
  #   default_model: qwen2.5:14b
  #   models:
  #     - role: text
  #       name: qwen2.5:14b
  #     - role: vision
  #       name: qwen2.5vl:7b
